name: release

# A tag is the trigger: v0.1.0, v0.2.0-rc.1, … The tag is cut from main,
# which the ci workflow has already tested; this workflow produces and
# publishes the artifacts. Runnable by hand with an existing tag, which is how
# a build is dry-run before anyone commits to a release.
#
# What ships, per platform: one archive holding `mnemo` (Bun-compiled, no Bun
# or Node needed) and `memsrv` (the Rust memory sidecar), beside each other —
# the place mnemo looks for its sidecar first. Plus SHA256SUMS, and the two
# installers, so `…/releases/latest/download/install.sh` always matches.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: an older glibc, so the binaries run on more distributions.
          - { platform: linux-x64, os: ubuntu-22.04, bun: bun-linux-x64, rust: x86_64-unknown-linux-gnu, ext: "" }
          - { platform: linux-arm64, os: ubuntu-22.04-arm, bun: bun-linux-arm64, rust: aarch64-unknown-linux-gnu, ext: "" }
          - { platform: darwin-arm64, os: macos-14, bun: bun-darwin-arm64, rust: aarch64-apple-darwin, ext: "" }
          - { platform: darwin-x64, os: macos-13, bun: bun-darwin-x64, rust: x86_64-apple-darwin, ext: "" }
          - { platform: windows-x64, os: windows-latest, bun: bun-windows-x64, rust: x86_64-pc-windows-msvc, ext: ".exe" }
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      # The version a binary reports is package.json's: the tag must agree.
      - name: the tag matches the version
        shell: bash
        run: |
          v=$(node -p "require('./app/package.json').version" 2>/dev/null || bun -e "console.log(require('./app/package.json').version)")
          [ "v$v" = "${TAG%%-*}" ] || [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG but app/package.json says $v"; exit 1; }

      - name: memsrv
        shell: bash
        working-directory: memory-layer
        run: cargo build --release --locked --bin memsrv --target ${{ matrix.rust }} || cargo build --release --bin memsrv --target ${{ matrix.rust }}

      - name: mnemo
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd app && bun scripts/build.ts ${{ matrix.bun }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage out
          cp app/dist/mnemo-${{ matrix.bun }}${{ matrix.ext }} stage/mnemo${{ matrix.ext }}
          cp memory-layer/target/${{ matrix.rust }}/release/memsrv${{ matrix.ext }} stage/memsrv${{ matrix.ext }}
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            (cd stage && 7z a ../out/mnemo-${{ matrix.platform }}.zip mnemo.exe memsrv.exe >/dev/null)
          else
            tar -czf out/mnemo-${{ matrix.platform }}.tar.gz -C stage mnemo memsrv
          fi
          ls -l out

      # On a machine with nothing installed, the binary answers, finds its
      # sidecar beside it, and runs a whole scripted turn.
      - name: the archive works on its own
        shell: bash
        run: |
          set -euo pipefail
          export MNEMO_HOME="$RUNNER_TEMP/mnemo-home"
          got=$(stage/mnemo${{ matrix.ext }} --version)
          echo "$got"
          stage/mnemo${{ matrix.ext }} doctor | tee doctor.txt
          grep -q "✓ memory" doctor.txt || { echo "::error::mnemo did not find memsrv beside it"; exit 1; }
          stage/mnemo${{ matrix.ext }} --demo --dump | grep -q "retries"

      # Pinned by major version, not a commit: pin to a reviewed SHA before the first release.
      - uses: actions/upload-artifact@v4
        with:
          name: mnemo-${{ matrix.platform }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TAG }}
      # Pinned by major version, not a commit: pin to a reviewed SHA before the first release.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and installers
        run: |
          set -euo pipefail
          cp app/scripts/get.sh dist/install.sh
          cp app/scripts/get.ps1 dist/install.ps1
          cd dist
          sha256sum mnemo-* > SHA256SUMS
          cat SHA256SUMS
      # No third-party release action: the runner has gh.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "Mnemo $TAG" --generate-notes $prerelease || gh release upload "$TAG" dist/* --clobber
