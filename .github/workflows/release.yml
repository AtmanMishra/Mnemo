name: release

# A tag is the trigger: v0.1.0, v0.2.0-rc.1, … Cut it from main with
# scripts/release.sh (docs/RELEASING.md), which bumps the versions and tags.
#
# Run by hand (Actions → release → Run workflow) it is a DRY RUN: all five
# platforms are built, smoke-tested and attested, the archives are kept as the
# run's artifacts, and nothing is published. Set `tag` and `publish` to publish
# a tag that already exists.
#
# What ships, per platform: one archive holding `mnemo` (Bun-compiled, no Bun or
# Node needed) and `memsrv` (the Rust memory sidecar), side by side — the place
# mnemo looks for its sidecar first. Plus SHA256SUMS, the two installers, and a
# Homebrew formula and a Scoop manifest generated from those checksums.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build, e.g. v0.1.0 (empty: build this branch, dry run)"
        required: false
      publish:
        description: "publish a GitHub release for `tag` (it must be on main)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Empty on a dry run.
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: an older glibc, so the binaries run on more distributions.
          - { platform: linux-x64, os: ubuntu-22.04, bun: bun-linux-x64, rust: x86_64-unknown-linux-gnu, ext: "" }
          - { platform: linux-arm64, os: ubuntu-22.04-arm, bun: bun-linux-arm64, rust: aarch64-unknown-linux-gnu, ext: "" }
          - { platform: darwin-arm64, os: macos-14, bun: bun-darwin-arm64, rust: aarch64-apple-darwin, ext: "" }
          # Native Intel runner: the binary is built and smoke-tested on the CPU it ships for.
          - { platform: darwin-x64, os: macos-15-intel, bun: bun-darwin-x64, rust: x86_64-apple-darwin, ext: "" }
          - { platform: windows-x64, os: windows-latest, bun: bun-windows-x64, rust: x86_64-pc-windows-msvc, ext: ".exe" }
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # build provenance
      attestations: write
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      # The version a binary reports is package.json's: the tag must agree.
      - name: the tag matches the versions
        if: ${{ env.TAG != '' }}
        shell: bash
        run: |
          want="${TAG#v}"; want="${want%%-*}"
          for f in app/package.json packages/memory/package.json; do
            v=$(bun -e "console.log(require('./$f').version)")
            [ "${v%%-*}" = "$want" ] || { echo "::error::tag $TAG but $f says $v"; exit 1; }
          done
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' memory-layer/Cargo.toml | head -1)
          [ "${v%%-*}" = "$want" ] || { echo "::error::tag $TAG but memory-layer/Cargo.toml says $v"; exit 1; }

      - name: memsrv
        shell: bash
        working-directory: memory-layer
        run: cargo build --release --locked --bin memsrv --target ${{ matrix.rust }}

      - name: mnemo
        shell: bash
        run: |
          bun install --frozen-lockfile
          cd app && bun scripts/build.ts ${{ matrix.bun }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage out
          cp app/dist/mnemo-${{ matrix.bun }}${{ matrix.ext }} stage/mnemo${{ matrix.ext }}
          cp memory-layer/target/${{ matrix.rust }}/release/memsrv${{ matrix.ext }} stage/memsrv${{ matrix.ext }}
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            (cd stage && 7z a ../out/mnemo-${{ matrix.platform }}.zip mnemo.exe memsrv.exe >/dev/null)
          else
            tar -czf out/mnemo-${{ matrix.platform }}.tar.gz -C stage mnemo memsrv
          fi
          ls -l out

      # On a machine with nothing installed, the binary answers, finds its
      # sidecar beside it, and runs a whole scripted turn.
      - name: the archive works on its own
        shell: bash
        run: |
          set -euo pipefail
          export MNEMO_HOME="$RUNNER_TEMP/mnemo-home"
          got=$(stage/mnemo${{ matrix.ext }} --version)
          echo "$got"
          stage/mnemo${{ matrix.ext }} doctor | tee doctor.txt
          grep -q "✓ memory" doctor.txt || { echo "::error::mnemo did not find memsrv beside it"; exit 1; }
          stage/mnemo${{ matrix.ext }} --demo --dump | grep -q "retries"

      # The one-liner's own script, run against this very archive: install,
      # upgrade in place, uninstall. SHA256SUMS is made here only for the test.
      - name: the installer installs it
        if: ${{ matrix.ext == '' }}
        shell: bash
        run: |
          set -euo pipefail
          (cd out && if command -v sha256sum >/dev/null; then sha256sum mnemo-* > SHA256SUMS; else shasum -a 256 mnemo-* > SHA256SUMS; fi)
          export HOME="$RUNNER_TEMP/home" MNEMO_HOME="$RUNNER_TEMP/home/.mnemo" MNEMO_RELEASE_BASE="file://$PWD/out"
          mkdir -p "$HOME"
          sh app/scripts/get.sh
          "$MNEMO_HOME/bin/mnemo" --version
          sh app/scripts/get.sh # upgrade in place
          sh app/scripts/get.sh --uninstall
          test ! -e "$MNEMO_HOME/bin/mnemo"
          rm out/SHA256SUMS

      - name: the installer installs it (Windows)
        if: ${{ matrix.ext == '.exe' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sum = (Get-FileHash -Algorithm SHA256 out/mnemo-windows-x64.zip).Hash.ToLower()
          "$sum  mnemo-windows-x64.zip" | Set-Content -Encoding ascii out/SHA256SUMS
          $env:MNEMO_HOME = Join-Path $env:RUNNER_TEMP "mnemo-home"
          $env:MNEMO_RELEASE_BASE = (Resolve-Path out).Path
          & ./app/scripts/get.ps1
          & (Join-Path $env:MNEMO_HOME "bin/mnemo.exe") --version
          & ./app/scripts/get.ps1 # upgrade in place
          $env:MNEMO_UNINSTALL = "1"
          & ./app/scripts/get.ps1
          if (Test-Path (Join-Path $env:MNEMO_HOME "bin/mnemo.exe")) { throw "mnemo.exe is still installed after the uninstall" }
          Remove-Item out/SHA256SUMS

      # Private repositories need an Enterprise plan for attestations; public ones do not.
      # actions/attest-build-provenance v4.2.2
      - name: attest the archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: out/*

      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mnemo-${{ matrix.platform }}
          path: out/*

  publish:
    needs: build
    # Only a tag publishes; a dry run stops after the build.
    if: ${{ github.ref_type == 'tag' || (inputs.publish && inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      # A release is cut from main, which the ci workflow has already tested.
      - name: the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main: merge first, then tag"; exit 1; }

      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: checksums, installers and package manifests
        run: |
          set -euo pipefail
          cp app/scripts/get.sh dist/install.sh
          cp app/scripts/get.ps1 dist/install.ps1
          (cd dist && sha256sum mnemo-* > SHA256SUMS && cat SHA256SUMS)
          bun app/scripts/manifests.ts "$TAG" dist

      # No third-party release action: the runner has gh.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          notes="--generate-notes"
          [ -f "docs/releases/$TAG.md" ] && notes="--notes-file docs/releases/$TAG.md"
          gh release create "$TAG" dist/* --title "Mnemo $TAG" $notes $prerelease || gh release upload "$TAG" dist/* --clobber

      # Optional: keep a Homebrew tap and a Scoop bucket current. Set the
      # TAP_TOKEN secret (a fine-grained token with contents:write on those two
      # repos) and the repos exist; otherwise this step is skipped. A failure
      # here never fails the release: the manifests are attached to it anyway.
      - name: update the Homebrew tap and Scoop bucket
        if: ${{ !contains(env.TAG, '-') }}
        continue-on-error: true
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "TAP_TOKEN not set: skipping"; exit 0; }
          owner="${GITHUB_REPOSITORY_OWNER}"
          push() { # repo, source file, path in repo
            git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${owner}/$1.git" "tmp-$1"
            mkdir -p "tmp-$1/$(dirname "$3")" && cp "$2" "tmp-$1/$3"
            git -C "tmp-$1" -c user.name="mnemo release" -c user.email="actions@users.noreply.github.com" add -A
            git -C "tmp-$1" -c user.name="mnemo release" -c user.email="actions@users.noreply.github.com" commit -m "mnemo $TAG" || return 0
            git -C "tmp-$1" push
          }
          push homebrew-mnemo dist/mnemo.rb Formula/mnemo.rb
          push scoop-mnemo dist/mnemo.json bucket/mnemo.json
