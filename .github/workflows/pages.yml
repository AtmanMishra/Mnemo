name: site

# The project page and the one-liner installers, on GitHub Pages. See
# docs/RELEASING.md for the one-time setup (Settings → Pages → Source: GitHub
# Actions, then the custom domain).
on:
  push:
    branches: [main]
    paths: ["site/**", "app/scripts/get.sh", "app/scripts/get.ps1", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pages needs a public repository (or a paid plan) with Pages switched on; until
    # then this stays quiet instead of failing every push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The installers are copied from their one source, so the page, the
      # release asset and the repository always carry the same script.
      - name: assemble the site
        run: |
          set -euo pipefail
          mkdir _site
          cp -r site/. _site/
          cp app/scripts/get.sh _site/install.sh
          cp app/scripts/get.ps1 _site/install.ps1
          touch _site/.nojekyll
          sh -n _site/install.sh
          test -s _site/index.html
          ls -l _site
      # actions/configure-pages v6.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
