name: ci

# 7.1: every push and PR runs all four suites. They are independent, so they
# run as separate jobs and a red Rust suite still tells you about TypeScript.
on:
  push:
    branches: [main]
  pull_request:

# The default token can write (issue comments, etc.) — nothing here needs
# that. Least privilege: read is all catching a red test needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags: a tag is a mutable label and a
# supply-chain change lands before the workflow file is ever re-reviewed.
# Each pin carries the tag it was resolved from so an upgrade is a
# deliberate, diffable step.
#
# One accepted exception: dtolnay/rust-toolchain is a moving "stable" branch
# by design. Pinning its SHA freezes the toolchain — rust updates stop
# arriving — so it tracks stable, with the drift risk that implies (a rustc
# change can land without a workflow diff). Everything else is a fixed SHA.
jobs:
  memory-layer:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain stable (moving branch — see header note)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: memory-layer
      - name: cargo test
        working-directory: memory-layer
        run: cargo test --all-targets

  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: memory-layer
      - name: build memeval
        working-directory: memory-layer
        run: cargo build --locked --bin memeval
      # Runs memeval --hash --json and asserts the published rounded floors:
      # Hit@1 >= 73%, Hit@3 >= 77%, MRR >= 0.743, n=22. No remote embedder.
      - name: enforce offline retrieval floor
        working-directory: memory-layer
        run: cargo test --locked --offline --test memeval_gate

  agent:
    # Two runners, not one. This suite was written on a POSIX host and
    # carried assumptions that only Windows disproves: os.tmpdir() there
    # sits under the user's home, so skill discovery's ancestor walk left
    # the fixture and picked up the developer's own ~/.agents/skills as
    # "project" skills; commands go through cmd.exe, not /bin/sh; and NTFS
    # has no POSIX mode bits, so a 0600 assertion cannot hold there at all.
    # Every one of those passed on ubuntu for as long as nobody ran the
    # suite on Windows - which is exactly the failure this leg moves from a
    # maintainer's laptop to a PR.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # 22.18 is the floor, and it is a measured floor: 22.6 shipped type
          # stripping behind --experimental-strip-types, so pinning 22.6 here
          # made every .ts test die on ERR_UNKNOWN_FILE_EXTENSION — the whole
          # agent and harness-engine suites were red on main for weeks with
          # nobody noticing, because CI is where they run.
          node-version: "22.18"
      # dtolnay/rust-toolchain stable (moving branch — see header note)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # the memory tests talk to the real sidecar
      - name: build memsrv
        working-directory: memory-layer
        run: cargo build --bin memsrv
      # npm ci installs exactly the lockfile's tree — a dependency drift can
      # only be introduced deliberately, never by a timestamp
      - name: npm ci
        working-directory: agent
        run: npm ci
      - name: typecheck
        working-directory: agent
        run: npx tsc --noEmit
      - name: npm test
        working-directory: agent
        run: npm test

  harness-engine:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.18"
      - name: npm ci
        working-directory: harness-engine
        run: npm ci
      # one watcher test is timing-based; a single retry keeps CI honest
      # without hiding a real failure, since a genuine break fails twice
      - name: npm test
        working-directory: harness-engine
        run: npm test || npm test

  app:
    # The Bun application (the interface on pi). Three runners for the same
    # reason as tui-go below: the terminal is where portability breaks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      # The memory tests run against the real sidecar; without it they skip.
      - name: build memsrv
        working-directory: memory-layer
        run: cargo build --release --bin memsrv
      # One Bun workspace (app + packages/*), one lockfile at the root.
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: app
        run: bunx tsc --noEmit
      - name: bun test
        working-directory: app
        run: bun test ./test
      # @mnemo/memory stands alone: other agents attach to it without the app.
      - name: memory package typecheck
        working-directory: packages/memory
        run: bunx tsc --noEmit
      - name: memory package test
        working-directory: packages/memory
        run: bun test ./test
      - name: compiled binary renders a frame
        working-directory: app
        shell: bash
        run: |
          bun scripts/build.ts
          MNEMO_HOME="$RUNNER_TEMP/mnemo-home" ./dist/mnemo --demo --dump | grep -q "retries"

  tui-go:
    # Three runners, not one. This suite was written on a POSIX host and its
    # fixtures, its path expectations and (mostly) its golden frames assumed
    # one; making them portable is only worth anything if something notices the
    # next time it stops being true. The failure this guards against is quiet:
    # on Windows the acceptance frames compared CRLF against LF and failed
    # while `git status` showed a clean tree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: tui-go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27"
      - name: go vet
        working-directory: tui-go
        run: go vet ./...
      - name: go test
        working-directory: tui-go
        run: go test ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0; fetch-depth 0 so the history sweep below
      # can grep past commits
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # a key reached a commit once already; this is the automated version of
      # the manual pre-push check in HANDOFF section 6.
      #
      # The pattern covers the credential shapes that have actually appeared
      # or plausibly will: session keys (sk-*; sk-or-v1-* for OpenRouter),
      # classic and fine-grained GitHub tokens, AWS access keys, and a
      # generic API_KEY=long-string assignment. Fixtures that legitimately
      # hold these shapes live ONLY under agent/test/ — both files are
      # excluded here, so a fixture added anywhere else trips the gate.
      #
      # The working-tree scan catches a key on disk; the history sweep
      # catches one that was committed and then rotated. It is bounded to the
      # most recent 200 commits (verified cheap: 80 commits in ~1.6s locally)
      # and stops at the first hit. A full-history scan is deferred: it is
      # unbounded cost for the same single finding this already catches.
      - name: scan for credential-shaped strings
        run: |
          # The pattern lives in the script, not in a folded YAML scalar: `>-`
          # turns line breaks into spaces, and a space inside an alternation
          # branch is a branch that can never match a token at line start
          # (that bug shipped once — github_pat_ and API_KEY= only matched when
          # something preceded them).
          #
          # The pattern covers the credential shapes that have actually appeared
          # or plausibly will: session keys (sk-*; sk-or-v1-* for OpenRouter),
          # classic and fine-grained GitHub tokens, AWS access keys, and a
          # generic API_KEY=long-string assignment.
          #
          # Excluded paths are redaction FIXTURES: files that hold a realistic
          # key shape on purpose, because a test that proves scrubbing works
          # has to feed it something that looks real. The gate cannot tell a
          # fixture from a leak, so every new one belongs on this list — the
          # gate going red for a fixture is how it trains people to ignore it.
          # audit/FINDINGS.jsonl is on the list for the same reason: the audit
          # quotes the fixture strings as evidence, and it is a record, not code.
          GATE_PAT="(sk-[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|[Aa][Pp][Ii][_-]?[Kk][Ee][Yy][\"']?[:=][[:space:]]*[\"']?[A-Za-z0-9_-]{20,})"
          exclude=':!agent/test/trace.test.ts :!agent/test/hooks_executor.test.ts :!agent/test/childenv.test.ts :!agent/test/hooks_engine.test.ts :!audit/FINDINGS.jsonl :!.github/workflows/ci.yml'
          if git grep -nE "$GATE_PAT" -- $exclude; then
            echo "::error::credential-shaped string found outside the redaction fixtures"
            exit 1
          fi
          # The working-tree scan catches a key on disk; the history sweep
          # catches one that was committed and then rotated. It is bounded to the
          # most recent 200 commits (verified cheap: 80 commits in ~1.6s locally)
          # and stops at the first hit. A full-history scan is deferred: it is
          # unbounded cost for the same single finding this already catches.
          for sha in $(git rev-list --max-count=200 HEAD); do
            if git grep -qE "$GATE_PAT" "$sha" -- $exclude 2>/dev/null; then
              echo "::error::credential-shaped string found in commit $sha (history)"
              git grep -nE "$GATE_PAT" "$sha" -- $exclude
              exit 1
            fi
          done
          echo "no credential-shaped strings found (working tree + last 200 commits)"
