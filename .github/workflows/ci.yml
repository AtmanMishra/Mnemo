name: ci

# 7.1: every push and PR runs all four suites. They are independent, so they
# run as separate jobs and a red Rust suite still tells you about TypeScript.
on:
  push:
    branches: [main]
  pull_request:

# The default token can write (issue comments, etc.) — nothing here needs
# that. Least privilege: read is all catching a red test needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs, not tags: a tag is a mutable label and a
# supply-chain change lands before the workflow file is ever re-reviewed.
# Each pin carries the tag it was resolved from so an upgrade is a
# deliberate, diffable step.
#
# One accepted exception: dtolnay/rust-toolchain is a moving "stable" branch
# by design. Pinning its SHA freezes the toolchain — rust updates stop
# arriving — so it tracks stable, with the drift risk that implies (a rustc
# change can land without a workflow diff). Everything else is a fixed SHA.
jobs:
  memory-layer:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # dtolnay/rust-toolchain stable (moving branch — see header note)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: memory-layer
      - name: cargo test
        working-directory: memory-layer
        run: cargo test --all-targets

  agent:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # 22.6 is the floor: below it node cannot run our .ts files at all
          node-version: "22.6"
      # dtolnay/rust-toolchain stable (moving branch — see header note)
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      # the memory tests talk to the real sidecar
      - name: build memsrv
        working-directory: memory-layer
        run: cargo build --bin memsrv
      # npm ci installs exactly the lockfile's tree — a dependency drift can
      # only be introduced deliberately, never by a timestamp
      - name: npm ci
        working-directory: agent
        run: npm ci
      - name: typecheck
        working-directory: agent
        run: npx tsc --noEmit
      - name: npm test
        working-directory: agent
        run: npm test

  harness-engine:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.6"
      - name: npm ci
        working-directory: harness-engine
        run: npm ci
      # one watcher test is timing-based; a single retry keeps CI honest
      # without hiding a real failure, since a genuine break fails twice
      - name: npm test
        working-directory: harness-engine
        run: npm test || npm test

  tui-go:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27"
      - name: go vet
        working-directory: tui-go
        run: go vet ./...
      - name: go test
        working-directory: tui-go
        run: go test ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0; fetch-depth 0 so the history sweep below
      # can grep past commits
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # a key reached a commit once already; this is the automated version of
      # the manual pre-push check in HANDOFF section 6.
      #
      # The pattern covers the credential shapes that have actually appeared
      # or plausibly will: session keys (sk-*; sk-or-v1-* for OpenRouter),
      # classic and fine-grained GitHub tokens, AWS access keys, and a
      # generic API_KEY=long-string assignment. Fixtures that legitimately
      # hold these shapes live ONLY under agent/test/ — both files are
      # excluded here, so a fixture added anywhere else trips the gate.
      #
      # The working-tree scan catches a key on disk; the history sweep
      # catches one that was committed and then rotated. It is bounded to the
      # most recent 200 commits (verified cheap: 80 commits in ~1.6s locally)
      # and stops at the first hit. A full-history scan is deferred: it is
      # unbounded cost for the same single finding this already catches.
      - name: scan for credential-shaped strings
        env:
          GATE_PAT: >-
            (sk-[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|
            github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|
            [Aa][Pp][Ii][_-]?[Kk][Ee][Yy][\"']?[:=][[:space:]]*[\"']?[A-Za-z0-9_-]{20,})
        run: |
          exclude=':!agent/test/trace.test.ts :!agent/test/hooks_executor.test.ts :!.github/workflows/ci.yml'
          if git grep -nE "$GATE_PAT" -- $exclude; then
            echo "::error::credential-shaped string found outside the redaction fixtures"
            exit 1
          fi
          for sha in $(git rev-list --max-count=200 HEAD); do
            if git grep -qE "$GATE_PAT" "$sha" -- $exclude 2>/dev/null; then
              echo "::error::credential-shaped string found in commit $sha (history)"
              git grep -nE "$GATE_PAT" "$sha" -- $exclude
              exit 1
            fi
          done
          echo "no credential-shaped strings found (working tree + last 200 commits)"