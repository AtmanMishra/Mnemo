name: flaky-stress
# Temporary, for the flaky-test PR only: runs the tests that flaked many times over on the
# runners they flaked on, so a fix is proved by repetition. Removed before the PR is ready.
on:
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: shell and workspace tests, 15 times
        working-directory: app
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 15); do
            if ! bun test --timeout 30000 test/shell.test.ts test/workspace.test.ts > run.log 2>&1; then
              fails=$((fails+1)); echo "::warning::run $i failed"; grep -E "^\(fail\)|error:" run.log
            fi
            grep -E "^ [0-9]+ (pass|fail)" run.log | tr '\n' ' '; echo
          done
          echo "failed runs: $fails of 15"
          [ "$fails" = 0 ]

  sessions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Defender status
        shell: pwsh
        continue-on-error: true
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, OnAccessProtectionEnabled | Format-List
          (Get-MpPreference).ExclusionPath
      - name: step timings, temp folder
        run: bun .github/flaky-diag/sessions-diag.ts "" 60
      - name: step timings, workspace folder
        shell: bash
        run: bun .github/flaky-diag/sessions-diag.ts "$GITHUB_WORKSPACE/.." 60
      - name: temp folder on the fast disk, as ci.yml does
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: step timings, temp folder after the move
        run: bun .github/flaky-diag/sessions-diag.ts "" 60
      - name: memory package tests, 30 times
        working-directory: packages/memory
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 30); do
            if ! bun test ./test/sessions.test.ts > run.log 2>&1; then fails=$((fails+1)); cat run.log; fi
            grep -E "\(pass\) finds the exchange" run.log
          done
          echo "failed runs: $fails of 30"
          [ "$fails" = 0 ]

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: build memsrv
        working-directory: memory-layer
        run: cargo build --release --bin memsrv
      - name: build
        working-directory: app
        run: bun scripts/build.ts
      - name: interactive end to end, 10 times
        working-directory: app
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 10); do
            if ! MNEMO_E2E_BIN="$PWD/dist/mnemo" bun test --timeout 120000 ./e2e/interactive.e2e.test.ts > run.log 2>&1; then
              fails=$((fails+1)); echo "::warning::run $i failed"; grep -E "^\(fail\)|error:" -A8 run.log | head -60
            fi
            grep -E "^ [0-9]+ (pass|fail)" run.log | tr '\n' ' '; echo
          done
          echo "failed runs: $fails of 10"
          [ "$fails" = 0 ]
