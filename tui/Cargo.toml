[package]
name = "seatui"
version = "0.1.0"
edition = "2021"
description = "PIXEL-design terminal UI for the sea-agent coding agent"

[dependencies]
ratatui = { version = "0.29",  }
crossterm = "0.28"
serde_json = "1"

[lib]
name = "seatui"
path = "src/lib.rs"

[[bin]]
name = "seatui"
path = "src/main.rs"

[[bin]]
name = "mnemo-cockpit"
path = "src/cockpit_main.rs"
