[package]
name = "seatui"
version = "0.1.0"
edition = "2021"
description = "mnemo-agent: the Mnemo terminal app (onboarding, projects, sessions, chat)"

[dependencies]
ratatui = { version = "0.29",  }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "seatui"
path = "src/lib.rs"

[[bin]]
name = "mnemo-agent"
path = "src/agent_main.rs"
