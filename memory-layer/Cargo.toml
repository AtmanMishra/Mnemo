[package]
name = "memory-layer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Atman Mishra"]
repository = "https://github.com/AtmanMishra/Mnemo"
description = "memsrv: the memory sidecar for Mnemo"

[dependencies]
hnsw_rs = "0.3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
ureq = { version = "3.4.0", features = ["json"] }
ratatui = "0.30"
crossterm = "0.29"
fd-lock = "4.0.4"

[[bin]]
name = "mempolicy"
path = "src/bin/mempolicy.rs"
