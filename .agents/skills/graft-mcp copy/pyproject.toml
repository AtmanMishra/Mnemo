[project]
name = "graft-mcp"
version = "0.1.0"
description = "Graft codebase-understanding graph: kernel API + MCP client for the graft CLI"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graft_mcp"]
